<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cambridge — Entrar</title>
<style>
  :root {
    --fundo: #f6f4ef;
    --texto: #1f2328;
    --suave: #5c6470;
    --cartao: #ffffff;
    --borda: #d9d4c9;
    --destaque: #7a1f2b;
    --erro: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #16181c;
      --texto: #e8e6e1;
      --suave: #a3a9b3;
      --cartao: #1f2228;
      --borda: #353a43;
      --destaque: #e0828d;
      --erro: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--fundo); color: var(--texto);
    font: 16px/1.5 system-ui, sans-serif;
    padding: 16px;
  }
  form {
    width: 100%; max-width: 360px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font: 1.8rem Georgia, "Times New Roman", serif; }
  p.sub { margin: 0 0 20px; color: var(--suave); font-size: .9rem; }
  label { display: block; font-size: .85rem; margin: 12px 0 4px; color: var(--suave); }
  input {
    width: 100%; padding: 10px 12px; font: inherit;
    border: 1px solid var(--borda); border-radius: 8px;
    background: var(--fundo); color: var(--texto);
  }
  input:focus { outline: 2px solid var(--destaque); outline-offset: 1px; }
  button {
    margin-top: 20px; width: 100%; padding: 11px; font: inherit; font-weight: 600;
    border: 0; border-radius: 8px; cursor: pointer;
    background: var(--destaque); color: #fff;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { color: var(--erro); font-size: .9rem; min-height: 1.4em; margin: 12px 0 0; }
</style>
</head>
<body>
<form id="entrar" autocomplete="on">
  <h1>Cambridge</h1>
  <p class="sub">Acesso restrito</p>
  <label for="usuario">Usuário</label>
  <input id="usuario" name="username" autocomplete="username" required autofocus>
  <label for="senha">Senha</label>
  <input id="senha" name="password" type="password" autocomplete="current-password" required>
  <button id="botao" type="submit">Entrar</button>
  <p class="erro" id="erro" role="alert"></p>
</form>
<noscript>Este site precisa de JavaScript para abrir.</noscript>
<script>
// Conteúdo cifrado (AES-256-GCM). A chave vem de PBKDF2(usuário + senha);
// nem a senha nem o conteúdo legível estão neste arquivo.
const DADOS = __DADOS__;

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function abrir(usuario, senha) {
  const frase = new TextEncoder().encode(usuario.trim().toLowerCase() + "\n" + senha);
  const base = await crypto.subtle.importKey("raw", frase, "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(DADOS.sal), iterations: DADOS.iteracoes },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(DADOS.iv) }, chave, b64(DADOS.cifrado));
  return new TextDecoder().decode(claro);
}

document.getElementById("entrar").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const botao = document.getElementById("botao");
  const erro = document.getElementById("erro");
  erro.textContent = "";
  botao.disabled = true;
  botao.textContent = "Abrindo…";
  try {
    const html = await abrir(
      document.getElementById("usuario").value,
      document.getElementById("senha").value);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    erro.textContent = "Usuário ou senha incorretos.";
    botao.disabled = false;
    botao.textContent = "Entrar";
  }
});
</script>
</body>
</html>
